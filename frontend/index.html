<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/wce-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Official AI-powered RAG Campus Assistant for Walchand College of Engineering (WCE), Sangli. Inquire about courses, admissions, academic calendar, and facilities." />
    <meta name="theme-color" content="#171329" />
    <title>WCE Campus Assistant | Walchand College of Engineering, Sangli</title>

    <!-- Prevent flash of unstyled theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('wce_theme_preference');
          var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
